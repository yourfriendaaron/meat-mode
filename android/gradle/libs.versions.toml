[versions]
agp = "9.4.1"
kotlin = "2.4.21"
activity = "1.13.0"
core = "1.18.0"
webkit = "1.17.1"
work = "2.12.0"
unifiedpush-connector = "3.3.5"
unifiedpush-fcm = "3.1.0"
junit = "4.13.2"
json = "20260814"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-work = { module = "androidx.work:work-runtime", version.ref = "work" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush-connector" }
unifiedpush-fcm = { module = "org.unifiedpush.android:embedded-fcm-distributor", version.ref = "unifiedpush-fcm" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
