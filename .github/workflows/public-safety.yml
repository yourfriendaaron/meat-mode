name: public-safety

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Shellcheck
        run: shellcheck scripts/*.sh tests/*.sh .githooks/pre-commit .githooks/commit-msg .githooks/pre-push
      - name: Guard tests
        run: bash tests/public-safety.test.sh
      - name: Scan tracked files
        run: bash scripts/public-safety.sh
      - name: Scan commit messages
        # The pre-push hook sees only pushes made from a clone with hooks
        # installed; merge and squash commits are made on GitHub's side and
        # reach main unscanned, so CI reads the pushed commits' messages.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DELETED: ${{ github.event.deleted }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          msgs=$(mktemp)
          case "$EVENT" in
            push)
              if [ "$DELETED" = true ]; then
                echo "A deleted ref publishes no message."
                exit 0
              fi
              # A new branch, or a force push whose old tip is gone: scan the tip alone.
              if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                git log --format=%B "$BEFORE..$SHA" > "$msgs"
              else
                git log -1 --format=%B "$SHA" > "$msgs"
              fi
              ;;
            pull_request)
              git fetch --no-tags origin "$BASE"
              git log --format=%B FETCH_HEAD..HEAD > "$msgs"
              ;;
            *)
              echo "No pushed commits in this run to scan."
              exit 0
              ;;
          esac
          bash scripts/public-safety.sh --message "$msgs"
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No beads data on the remote
        # Dolt pushes its data as refs/dolt/* and __dolt branches, past every
        # Git hook. The beads issues are private, so none may exist here.
        run: |
          refs=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" | awk '{print $2}' | grep -E '^refs/(dolt/|heads/__dolt)' || true)
          if [ -n "$refs" ]; then
            printf 'Beads data was pushed to this public repo:\n%s\nDelete these refs (see AGENTS.md).\n' "$refs"
            exit 1
          fi
