name: public-safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Shellcheck
        run: shellcheck scripts/*.sh tests/*.sh .githooks/pre-commit
      - name: Guard tests
        run: bash tests/public-safety.test.sh
      - name: Scan tracked files
        run: bash scripts/public-safety.sh
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
