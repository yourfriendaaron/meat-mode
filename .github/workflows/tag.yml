name: tag

# Gives every push to main that passes CI the next patch version; the tag push
# starts release.yml. The tag goes up over SSH with the TAG_DEPLOY_KEY deploy
# key, because the workflow token may not tag a commit that changes a workflow,
# and a tag it pushes starts no other workflow. A tag pushed by hand (say
# v0.2.0) releases the same way, and numbering carries on from it.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.TAG_DEPLOY_KEY }}
      - name: Tag the next version
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A pre-release tag (v0.2.0-rc1) is not the latest release.
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- - | head -n1)
          if [ -z "$latest" ]; then
            tag=v0.1.0
          elif git merge-base --is-ancestor "$SHA" "$latest"; then
            echo "$SHA is already in $latest; nothing to tag."
            exit 0
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $SHA as $tag."
