name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal web/embed.go | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-build the bridge
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/meat-mode
          done

  trackers:
    # Each tracker's conformance suite against its real tool; go test skips
    # them where the tool is missing.
    runs-on: ubuntu-latest
    env:
      BD_VERSION: "1.3.1"
      BD_SHA256: 3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c # beads_1.3.1_linux_amd64.tar.gz
      BACKLOG_VERSION: "1.54.0"
      TK_VERSION: "0.3.2"
      TK_SHA256: 408f2c113ecc3bc071507593a78386f1b4cc743be6491c9e9f2627efd4d9902b # the ticket script at v0.3.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0" # keep in step with mise.toml
      - name: Install bd, Backlog.md and ticket
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          tarball="beads_${BD_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/${tarball}"
          echo "${BD_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP/tools" bd
          curl -fsSL -o "$RUNNER_TEMP/tools/tk" "https://raw.githubusercontent.com/wedow/ticket/v${TK_VERSION}/ticket"
          echo "${TK_SHA256}  $RUNNER_TEMP/tools/tk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tools/tk"
          npm install -g "backlog.md@${BACKLOG_VERSION}"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - run: bd version && backlog --version && command -v tk
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: go test ./internal/tracker/...

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0" # keep in step with mise.toml
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Screenshot baselines, rendered in the Playwright image that matches
  # @playwright/test, as `pnpm test:visual` does on any machine.
  visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0" # keep in step with mise.toml
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-results
          path: web/test-results
          retention-days: 7

  # The suite runs twice, against the binary and against the image, side by side.
  # The image leg loads the image the image job built and smoke-tested.
  e2e:
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [binary, image]
    env:
      BD_VERSION: "1.3.1"
      BD_SHA256: 3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c # beads_1.3.1_linux_amd64.tar.gz
      E2E_REQUIRE_BD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0" # keep in step with mise.toml
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Install bd from the beads release
        run: |
          tarball="beads_${BD_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/${tarball}"
          echo "${BD_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bd"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/bd" bd
          echo "$RUNNER_TEMP/bd" >> "$GITHUB_PATH"
      - run: bd version
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e typecheck
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      # The proxy tests run Caddy in front of the hub; pull it before the clock starts.
      - run: docker pull caddy:2.10.2-alpine
      - uses: actions/download-artifact@v4
        if: matrix.target == 'image'
        with:
          name: image
      - name: Load the image
        if: matrix.target == 'image'
        run: |
          gunzip -c image.tar.gz | docker load
          echo "E2E_IMAGE=meat-mode:ci" >> "$GITHUB_ENV"
      - name: End-to-end against the ${{ matrix.target }}
        run: pnpm --dir e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.target }}
          path: e2e/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t meat-mode:ci .
      - name: Smoke test
        run: |
          docker run -d --name mm -p 127.0.0.1:8080:8080 -e MEAT_MODE_PUBLIC_URL=http://127.0.0.1:8080 -e MEAT_MODE_USER=alex -e MEAT_MODE_VAPID_SUBJECT=mailto:alex@example.com meat-mode:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/state >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<html'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)
          test "$code" = 404
          docker logs mm
      - name: Save the image for the e2e job
        run: docker save meat-mode:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
