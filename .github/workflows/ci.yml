name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-build the bridge
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/meat-mode
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0" # keep in step with mise.toml
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meat-mode:ci .
      - name: Smoke test
        run: |
          docker run -d --name mm -p 127.0.0.1:8080:8080 -e MEAT_MODE_USER=alex meat-mode:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/state >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<html'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)
          test "$code" = 404
          docker logs mm
